<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f3f8;--surface:#ffffff;--surface2:#efedf5;--field:#f1eff7;--line:#e2dfeb;--text:#1b1a22;--muted:#6f6b7b;--faint:#a29eae;
 --accent:#6c5bd4;--accent-soft:#ebe7fb;--accent-text:#4d3fb0;--on-accent:#ffffff;--ok:#1f8a5b;--ok-soft:#e3f4ec;--warn:#9a6a10;--warn-soft:#fbf1dc;--danger:#c4455a;--danger-soft:#fbe9ec;
 --scrim:rgba(20,18,30,.42);--shadow:0 18px 50px rgba(20,18,30,.18);color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121118;--surface:#1b1a22;--surface2:#22202a;--field:#24222c;--line:#2e2c37;--text:#ecebf0;--muted:#8d8a96;--faint:#5f5c68;
 --accent:#b5a8f5;--accent-soft:#2a2640;--accent-text:#c9bcff;--on-accent:#221c47;--ok:#7fd4ad;--ok-soft:#1d2a23;--warn:#e8c06a;--warn-soft:#2c2618;--danger:#f08a9a;--danger-soft:#2e1d22;
 --scrim:rgba(5,4,8,.62);--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121118;--surface:#1b1a22;--surface2:#22202a;--field:#24222c;--line:#2e2c37;--text:#ecebf0;--muted:#8d8a96;--faint:#5f5c68;
 --accent:#b5a8f5;--accent-soft:#2a2640;--accent-text:#c9bcff;--on-accent:#221c47;--ok:#7fd4ad;--ok-soft:#1d2a23;--warn:#e8c06a;--warn-soft:#2c2618;--danger:#f08a9a;--danger-soft:#2e1d22;
 --scrim:rgba(5,4,8,.62);--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
*:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:600;font-size:15px;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand b{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:13px;background:var(--surface)}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;width:100%;transition:background .12s}
.li:hover{background:var(--surface2)}
.li.on{background:var(--accent-soft);color:var(--accent-text)}
.lname{flex:1;min-width:0}
.cnt{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.li.on .cnt{background:var(--surface);color:var(--accent-text)}
.cnt.hot{background:var(--warn-soft);color:var(--warn)}
.sdiv{height:1px;background:var(--line);margin:8px 10px}
main{padding:20px 36px 80px;max-width:1080px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;font-weight:600;margin:0;flex:1}
.mnav{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mnav button{padding:8px 10px;color:var(--muted)}.mnav button:hover{color:var(--text)}
.mnav span{font-weight:600;min-width:120px;text-align:center}
.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:inline-flex;gap:7px;align-items:center;background:var(--surface);transition:background .12s;white-space:nowrap}
.ghost:hover{background:var(--surface2)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.add:focus-within{border-color:var(--accent)}
.add input{flex:1;background:none;border:0;padding:8px 0;font-size:15px;min-width:0}
.parse{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin:8px 2px 0}
.parse:empty{margin:0}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:5px;align-items:center;background:var(--accent-soft);color:var(--accent-text)}
.pill.in{background:var(--ok-soft);color:var(--ok)}
.pill.tg{background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.pill.tg.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.gap{height:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:border-color .12s;min-width:0}
.kpi:hover{border-color:var(--faint)}
.kpi span{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi b{font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.kpi small{color:var(--muted);font-size:12px}
.kpi.main{background:var(--accent-soft);border-color:transparent}
.kpi.main b{color:var(--accent-text)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
.cardx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch h2{font-size:15px;font-weight:600;margin:0}
.ch a,.lnk{color:var(--accent-text);font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-of-type{border-top:0}
.ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.rb{flex:1;min-width:0}
.rb b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb span{color:var(--muted);font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--ok)}
.amt.dim{color:var(--muted);font-weight:500}
.seal{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.seal.card{background:var(--accent-soft);color:var(--accent-text)}
.seal.ref{background:var(--warn-soft);color:var(--warn)}
.seal.ok{background:var(--ok-soft);color:var(--ok)}
.seal.due{background:var(--warn-soft);color:var(--warn)}
.chipb{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;background:var(--surface);transition:border-color .12s;white-space:nowrap}
.chipb:hover{border-color:var(--faint)}
.chipb.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface)}
.filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.day{font-size:12px;font-weight:600;color:var(--muted);margin:14px 4px 6px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.calc{font-size:12px;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:3px 16px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.calc b{font-weight:600;color:var(--text)}
.catbar{display:grid;grid-template-columns:120px 1fr 100px;gap:10px;align-items:center;padding:6px 0}
.catbar .t{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}.catbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:0}
/* painel e janela */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 26px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.panel.open{transform:none}
.x{color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}.x:hover{background:var(--surface2);color:var(--text)}
.fr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.fr>span{color:var(--muted);font-size:13px}
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.bigval{font-size:28px;font-weight:600;background:none;border:0;width:100%;padding:0}
.tgl{display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 13px;line-height:1.45}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.sw2{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;margin-top:1px;transition:background .15s}
.sw2:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tgl input:checked+.sw2{background:var(--accent)}
.tgl input:checked+.sw2:after{transform:translateX(14px)}
.del{color:var(--danger);font-size:13px;width:max-content}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.modal.open{opacity:1;pointer-events:auto}
.mbox{width:min(460px,100%);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 26px 22px;display:flex;flex-direction:column;gap:14px;transform:translateY(8px);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.modal.open .mbox{transform:none}
.mbox h2{font-size:17px;font-weight:600;margin:0}
.mfoot{display:flex;justify-content:flex-end;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--field)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.toast{position:fixed;left:calc(50% + 115px);bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--text);color:var(--bg);border-radius:12px;padding:11px 16px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.modal,.mbox{transition:none}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand,.acct,.sdiv{display:none}.li{width:auto;white-space:nowrap}main{padding:18px 16px 80px}.top{flex-wrap:wrap}.toast{left:50%}}

.kpis{grid-template-columns:1.35fr 1.35fr 1fr 1fr}
.kpi.big b{font-size:28px}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.excol{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 8px;scroll-margin-top:16px}
.excol .group{border:0;padding:0;border-radius:0}
.excol .day{margin:16px 0 2px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.exh h2{font-size:17px;font-weight:600;margin:0 0 2px}
.exh span{color:var(--muted);font-size:12px}
.exh b{font-weight:600;color:var(--text)}.exh b.in{color:var(--ok)}
.extabs{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:6px}
.extabs button{padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.extabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pastbody{padding:0 0 10px 46px}
.ci.tint{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 22%,transparent)}
.row:has(.amt.dim) .ci.tint{opacity:.55}
.mbanner{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.mbanner span{flex:1}.mbanner b{font-weight:600}
.mbanner.fut{background:var(--accent-soft);border-color:transparent}
.addb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);padding:7px 9px;border-radius:9px;flex:none;transition:background .12s,color .12s}
.addb:hover{background:var(--surface2);color:var(--text)}
.addb.txt{border:1px solid var(--line);font-size:13px}
.ocr{display:flex;gap:14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 4px}
.othumb{width:64px;height:84px;border-radius:9px;background:var(--surface);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.othumb img{width:100%;height:100%;object-fit:cover}
.skl{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface) 0,var(--field) 40%,var(--surface) 80%);background-size:300% 100%;animation:shk 1.1s linear infinite}
@keyframes shk{from{background-position:100% 0}to{background-position:-100% 0}}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ogrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ogrid .field{color:var(--text);font-size:13px;padding:7px 9px}
.drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:20px;background:var(--scrim);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.drop span{font-size:13px;font-weight:400;opacity:.8}
.drop.show{opacity:1}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px}
.seg2 button{padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--danger)}
.seg2 button.on.in{color:var(--ok)}
.panel .rcpt img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.exh>div>span{display:block}
.exh .sbox{margin:0;width:220px;flex:none}
.sidecol .cardx .chart{margin-top:2px}
@media (max-width:1100px){.dash{grid-template-columns:1fr}}
.insights{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ins{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.ins .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.ins.warn .ic{background:var(--warn-soft);color:var(--warn)}
.ins.bad .ic{background:var(--danger-soft);color:var(--danger)}
.ins span{flex:1}
.ins button{color:var(--muted);display:grid;place-items:center;padding:4px;border-radius:6px}
.ins button:hover{background:var(--surface2);color:var(--text)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bud{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.bud .t{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bud .t i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bud .t i.w{background:var(--warn)}.bud .t i.d{background:var(--danger)}
.bud small{color:var(--muted);font-size:12px;white-space:nowrap}
.ctabs{display:flex;gap:6px;margin-bottom:12px}
.ctabs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface)}
.ctabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.ctabs i{width:10px;height:10px;border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .c{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cal .c.e{border:0;background:none}
.cal .c.today{border-color:var(--accent)}
.cal .c b{font-weight:600;color:var(--muted);font-size:11px}
.cal .ev{border-radius:6px;padding:2px 5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--warn-soft);color:var(--warn)}
.cal .ev.ok{background:var(--ok-soft);color:var(--ok)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted);margin-bottom:10px}
.sbox input{flex:1;background:none;border:0;padding:9px 0;color:var(--text)}
.day{display:flex;justify-content:space-between}
.day em{font-style:normal;font-weight:500}
.rcpt{display:flex;align-items:center;gap:10px;background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.rcpt img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.inst{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.inst:first-of-type{border-top:0}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
 <nav class="side" id="side" aria-label="Finanças"></nav>
 <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Lançamento"></aside>

/* regras */
const onConta=t=>t.acct==='conta'&&!t.noBal;
const saldo=()=>START+tx.filter(onConta).reduce((s,t)=>s+t.amt,0);
const cardItems=id=>tx.filter(t=>t.acct===id);
const cardTotal=id=>cardItems(id).reduce((s,t)=>s-t.amt,0);
const openBills=()=>cards.filter(c=>!c.paid).reduce((s,c)=>s+cardTotal(c.id),0);
const billTotal=()=>bills.filter(b=>!b.next).reduce((s,b)=>s+b.amt,0);
function previsto(){const sal=tx.filter(t=>t.kind==='receita'&&t.desc==='Salário').reduce((s,t)=>s+t.amt,0),outras=tx.filter(t=>t.kind==='receita'&&t.desc!=='Salário').reduce((s,t)=>s+t.amt,0),contas=billTotal(),avul=tx.filter(t=>t.kind==='avulsa'&&t.acct==='conta'&&!t.noBal).reduce((s,t)=>s-t.amt,0),aporte=tx.filter(t=>t.kind==='aporte').reduce((s,t)=>s-t.amt,0);return{sal,outras,contas,avul,aporte,total:sal+outras-contas-avul-aporte};}
const pending=()=>bills.filter(b=>!b.paid&&!b.next);
const refunds=()=>tx.filter(t=>t.refund&&t.refund.st==='pend');
const spentBy=()=>{const c={};tx.filter(t=>t.amt<0&&t.kind!=='aporte'&&t.kind!=='fatura'&&!t.noBal).forEach(t=>c[t.cat]=(c[t.cat]||0)-t.amt);return c;};

function txRow(t){return `<button class="row" data-tx="${t.id}">${cic(t.cat)}<div class="rb"><b>${esc(t.desc)}</b><span>${esc(t.cat)}${seals(t)}</span></div><span class="amt num ${t.amt>0?'in':''} ${isCard(t)||t.noBal?'dim':''}">${money(t.amt,true)}</span></button>`;}
/* avisos da Sofia */
function insights(){const out=[],sp=spentBy(),prev=HIST[0].cats;
 Object.entries(budgets).forEach(([k,b])=>{const v=sp[k]||0,p=v/b;if(p>=1)out.push({id:'b'+k,t:'bad',ic:'alert',txt:`${k} passou do orçamento: ${money(v)} de ${money(b)}.`});else if(p>=.8)out.push({id:'b'+k,t:'warn',ic:'alert',txt:`${k} já usou ${Math.round(p*100)}% do orçamento do mês.`});});
 cards.filter(c=>!c.paid).forEach(c=>{const n=daysToClose(c);if(n<=5)out.push({id:'c'+c.id,t:'',ic:'card',txt:`A fatura do ${c.name} fecha em ${n} ${n===1?'dia':'dias'} (${money(cardTotal(c.id))}). Compras depois disso vão para a fatura seguinte.`});});
 Object.entries(sp).forEach(([k,v])=>{const p0=prev[k];if(p0&&v>p0*1.2&&v-p0>50)out.push({id:'m'+k,t:'',ic:'spark',txt:`Você gastou ${Math.round((v/p0-1)*100)}% a mais em ${k} que em setembro.`});});
 return out.filter(x=>!dismissed.has(x.id)).slice(0,3);}
/* gráfico */
function chartSvg(){const W=640,Hh=170,pad=26,days=31,bw=(W-pad*2)/days;const out=Array(days+1).fill(0),inn=Array(days+1).fill(0);
 tx.filter(onConta).forEach(t=>{const k=+t.date.slice(8);if(t.amt<0)out[k]-=t.amt;else inn[k]+=t.amt;});
 let s=START;const sal=[];for(let k=1;k<=days;k++){s+=inn[k]-out[k];sal.push(s);}
 const maxO=Math.max(...out,1),maxS=Math.max(...sal,START),minS=Math.min(0,...sal);
 const y=v=>Hh-pad-(v-minS)/(maxS-minS)*(Hh-pad*2);
 let bars='';for(let k=1;k<=days;k++){const h=out[k]/maxO*(Hh-pad*2)*.55;const x=pad+(k-1)*bw;if(out[k])bars+=`<rect x="${x+1}" y="${Hh-pad-h}" width="${bw-2}" height="${h}" rx="2" fill="var(--danger)" opacity=".55"><title>${k}/10 · saiu ${hide?'•••':'R$ '+fmt(out[k])}</title></rect>`;if(inn[k])bars+=`<rect x="${x+1}" y="${pad}" width="${bw-2}" height="${Hh-pad*2}" rx="2" fill="var(--ok)" opacity=".12"><title>${k}/10 · entrou ${hide?'•••':'R$ '+fmt(inn[k])}</title></rect><circle cx="${x+bw/2}" cy="${pad-8}" r="3" fill="var(--ok)"/>`;}
 const pts=sal.map((v,i)=>`${pad+i*bw+bw/2},${y(v)}`).join(' ');
 const ticks=[1,8,15,22,29].map(k=>`<text x="${pad+(k-1)*bw+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${k}</text>`).join('');
 const today=`<line x1="${pad+(TODAY-1)*bw+bw/2}" x2="${pad+(TODAY-1)*bw+bw/2}" y1="${pad-12}" y2="${Hh-pad}" stroke="var(--faint)" stroke-dasharray="3 3"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Entradas, saídas e saldo de outubro"><line x1="${pad}" x2="${W-pad}" y1="${Hh-pad}" y2="${Hh-pad}" stroke="var(--line)"/>${bars}${today}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${ticks}</svg>`;}
/* lateral */
function renderSide(){const row=(id,ic,name,c,hot)=>`<button class="li ${view===id?'on':''}" data-v="${id}">${ico(ic)}<span class="lname">${name}</span>${c?`<em class="cnt ${hot?'hot':''}">${c}</em>`:''}</button>`;
 $('side').innerHTML=`<div class="brand"><b>S</b>Sofia OS</div><div class="acct"><i></i>Conta principal</div>${row('resumo','home','Resumo e extrato')}${row('contas','bill','Contas',pending().length,true)}${row('cartoes','card','Cartões')}${row('orc','target','Orçamentos')}${row('reserva','safe','Reserva')}${row('devol','back','Devoluções',refunds().length,true)}<div class="sdiv"></div>${row('rel','chart','Relatórios')}${row('hist','clock','Histórico')}`;
 $('side').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;closePanel();if(v==='hist'){view='resumo';exTab='hist';render();$('extrato')?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(v==='resumo')exTab='mes';view=v;render();window.scrollTo(0,0);});}

function topHtml(title,add=true){return `<div class="top"><h1>${title}</h1><div class="mnav"><button id="mPrev" aria-label="Mês anterior">${ico('left')}</button><span>${monthLabel()}</span><button id="mNext" aria-label="Próximo mês">${ico('right')}</button></div><button class="ghost" id="eye" aria-label="${hide?'Mostrar':'Esconder'} valores">${ico(hide?'eyeoff':'eye')}</button></div>${add?addHtml()+'<div class="gap"></div>':''}`;}
let qNoBal=false;
function parseQ(v){let raw=v.trim();const im=raw.match(/\b(\d{1,2})\s*x\b/i);let n=1;if(im){n=+im[1];raw=raw.replace(im[0],' ');}
 const m=raw.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);if(!m)return null;const val=pnum(m[1]);
 const nn=norm(raw),income=/^\+|recebi|salario|freela|pix recebido|reembolso|entrou/.test(nn);
 let acct='conta';if(/nubank|\bnu\b|roxinho/.test(nn))acct='nubank';else if(/cartao|credito|\binter\b/.test(nn)||n>1)acct='inter';if(income){acct='conta';n=1;}
 let cat='Outros';const K=[['Mercado',/mercado|feira|padaria|hortifruti|atacad/],['Transporte',/uber|\b99\b|bilhete|onibus|metro|gasolina|combustivel|estacion/],['Alimentação',/ifood|restaurante|lanche|almoco|jantar|cafe/],['Saúde',/farmacia|remedio|medic|academia|consulta/],['Assinaturas',/netflix|spotify|openai|assinatura|youtube|prime/],['Compras',/compra|loja|amazon|shopee|mercado livre|tv|monitor|celular|roupa|tenis/],['Moradia',/aluguel|condominio/]];
 for(const[c,r]of K)if(r.test(nn)){cat=c;break;}if(income)cat='Receita';
 let desc=raw.replace(m[0],'').replace(/\b(no |com |pelo )?(cart[aã]o|cr[eé]dito|inter|nubank|nu|roxinho)\b/ig,'').replace(/^\+/,'').replace(/\b(recebi|reais|r\$)\b/ig,'').replace(/\s+/g,' ').trim();desc=desc?desc.charAt(0).toUpperCase()+desc.slice(1):cat;
 return{val,n,income,acct,cat,desc};}
function showParse(){const el=$('parse'),v=$('q').value;if(!v.trim()){el.innerHTML='';return;}const p=parseQ(v);
 if(!p){el.innerHTML='<span>Escreva o valor junto: “mercado 87,50”</span>';return;}const c=cardOf(p.acct);
 el.innerHTML=`<span class="pill ${p.income?'in':''}">${p.income?'Receita':'Despesa'} ${hide?'R$ •••••':'R$ '+fmt(p.val)}</span>${p.n>1?`<span class="pill">${p.n}x de ${hide?'R$ •••':'R$ '+fmt(p.val/p.n)}</span>`:''}<span class="pill">${esc(p.desc)} · ${p.cat}</span><span class="pill">${c?`Cartão ${c.name} · fatura de ${billMonth(c)}`:'Conta principal'}</span>${budgets[p.cat]&&!p.income?`<span>${p.cat}: ${hide?'••':Math.round(((spentBy()[p.cat]||0)+p.val/p.n)/budgets[p.cat]*100)+'%'} do orçamento depois disso</span>`:''}<button class="pill tg ${qNoBal?'on':''}" id="nb">${qNoBal?ico('check',12):''}Não mexer no saldo</button><span>Enter para lançar</span>`;
 $('nb').onclick=()=>{qNoBal=!qNoBal;showParse();$('q').focus();};}
function wireTop(){$('eye').onclick=()=>{hide=!hide;render();};

 if($('noteBtn')){$('noteBtn').onclick=()=>$('noteFile').click();$('noteFile').onchange=e=>{const f=e.target.files[0];if(f)readNote(f);e.target.value='';};$('manBtn').onclick=()=>openManual();}

 <div class="fr"><span>Data</span><input type="date" class="field" id="mdt" value="${$('mdt')?.value||TODAYS}"></div>
 ${type==='out'?`<div class="fr"><span>Pago com</span><select class="field" id="ma"><option value="conta" ${acct==='conta'?'selected':''}>Conta principal</option>${cards.map(x=>`<option value="${x.id}" ${acct===x.id?'selected':''}>Cartão ${x.name} (fatura de ${billMonth(x)})</option>`).join('')}</select></div>
 ${c?`<div class="fr"><span>Parcelas</span><select class="field" id="mn">${[1,2,3,4,5,6,8,10,12].map(k=>`<option value="${k}" ${k===n?'selected':''}>${k===1?'À vista':k+'x'}</option>`).join('')}</select></div>`:''}`:''}
 <label class="rcpt" id="mrc">${rec?(rec.img?`<img src="${rec.img}" alt="">`:ico('clip',18)):ico('clip',18)}<span style="flex:1">${rec?`<b style="color:var(--text);font-weight:500">${esc(rec.name)}</b><br>Vai para o seu Drive`:'Anexar comprovante (opcional)'}</span><input type="file" id="mrf" accept="image/*,application/pdf" hidden></label>
 <label class="tgl"><input type="checkbox" id="mnb"><span class="sw2"></span><span><b style="font-weight:600">Não mexer no saldo</b><br><span style="color:var(--muted);font-size:12px">Fica registrado, mas o saldo continua igual.</span></span></label>
 ${type==='out'?`<label class="tgl"><input type="checkbox" id="mrr"><span class="sw2"></span><span><b style="font-weight:600">Vai ser reembolsada</b><br><span style="color:var(--muted);font-size:12px">Entra em Devoluções como valor a receber.</span></span></label>
 <label class="tgl"><input type="checkbox" id="mrep"><span class="sw2"></span><span><b style="font-weight:600">Repetir todo mês</b><br><span style="color:var(--muted);font-size:12px">Vira uma conta programada em Contas.</span></span></label>`:''}
 <span class="err" id="merr" style="color:var(--danger);font-size:13px;min-height:18px"></span>
 <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:auto"><button class="ghost" id="mx">Cancelar</button><button class="btn" id="mgo">${ico('check')}Lançar</button></div>`;
  $('mc').onclick=$('mx').onclick=closePanel;
  $('panel').querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;draw();});
  $('md').oninput=()=>{const g=parseQ($('md').value+' 1');if(g&&g.cat!=='Outros'&&[...$('mcat').options].some(o=>o.value===g.cat))$('mcat').value=g.cat;};
  if($('ma'))$('ma').onchange=()=>{acct=$('ma').value;n=1;draw();};if($('mn'))$('mn').onchange=()=>n=+$('mn').value;
  $('mrf').onchange=e=>{const f=e.target.files[0];if(!f)return;rec={name:f.name};if(/^image\//.test(f.type)){const r=new FileReader();r.onload=()=>{rec.img=r.result;draw();};r.readAsDataURL(f);}else draw();};
  $('mgo').onclick=()=>{const v=pnum($('mv').value);if(!v){$('merr').textContent='Digite o valor.';$('mv').focus();return;}const desc=$('md').value.trim()||$('mcat').value;
   const per=Math.round(v/n*100)/100;const t={id:++nid,date:$('mdt').value||TODAYS,desc,cat:$('mcat').value,amt:type==='in'?v:-per,acct:type==='in'?'conta':acct,kind:type==='in'?'receita':'avulsa',noBal:$('mnb').checked};
   if(n>1)t.inst={n,i:1,total:v};if(rec)t.receipt=rec;if($('mrr')?.checked)t.refund={v:per,st:'pend'};
   if($('mrep')?.checked){bills.push({id:'b'+(++nid),desc,amt:v,day:+t.date.slice(8),paid:t.id});t.kind='conta';}
   tx.push(t);lastNew=t.id;closePanel();view='resumo';exTab='mes';filter='all';search='';render();
   toast(n>1?`${n}x de R$ ${fmt(per)} lançado no ${cardOf(acct).name}.`:'Lançamento salvo.',[['Desfazer',()=>{tx=tx.filter(x=>x!==t);render();}]]);};
  setTimeout(()=>$('mv')?.focus(),60);};
 draw();$('scrim').classList.add('open');$('panel').classList.add('open');}
/* ações */
function payBill(id){const b=bills.find(x=>x.id===id);const t={id:++nid,date:TODAYS,desc:b.desc,cat:'Contas',amt:-b.amt,acct:'conta',kind:'conta'};tx.push(t);b.paid=t.id;render();toast(`${b.desc} paga hoje. Saldo agora: ${money(saldo())}.`,[['Desfazer',()=>{tx=tx.filter(x=>x!==t);b.paid=null;render();}]]);}
function recvRefund(id){const t=tx.find(x=>x.id===id);const r={id:++nid,date:TODAYS,desc:'Reembolso – '+t.desc.split(' – ')[0],cat:'Receita',amt:t.refund.v,acct:'conta',kind:'reembolso'};tx.push(r);t.refund.st='ok';render();toast(`${money(t.refund.v)} voltou para o saldo.`,[['Desfazer',()=>{tx=tx.filter(x=>x!==r);t.refund.st='pend';render();}]]);}
function openBudgets(){$('mbox').innerHTML=`<h2>Orçamento por categoria</h2>${Object.keys(CATS).filter(k=>!['Receita','Reserva','Contas','Moradia'].includes(k)).map(k=>`<div class="fr"><span style="display:flex;gap:8px;align-items:center">${ico(CATS[k],14)}${k}</span><input class="field" data-bk="${k}" inputmode="decimal" placeholder="Sem limite" value="${budgets[k]?fmt(budgets[k]):''}"></div>`).join('')}<div class="mfoot"><button class="ghost" id="bc">Cancelar</button><button class="btn" id="bg">Salvar</button></div>`;
 $('modal').classList.add('open');$('bc').onclick=closeModal;$('bg').onclick=()=>{const nb={};document.querySelectorAll('[data-bk]').forEach(x=>{const v=pnum(x.value);if(v>0)nb[x.dataset.bk]=v;});budgets=nb;closeModal();render();toast('Orçamentos salvos.');};}
function openReserve(k){const titles={add:'Guardar dinheiro',take:'Retirar da reserva',plan:'Editar aportes',adj:'Ajustar valor guardado'};let mode='recompor';
 const draw=()=>{$('mbox').innerHTML=`<h2>${titles[k]}</h2>${k==='plan'?`<div class="fr"><span>Valor por mês</span><input class="field" id="rv" inputmode="decimal" value="${fmt(reserve.monthly)}"></div><div class="fr"><span>Dia</span><input class="field" id="rd" inputmode="numeric" value="${reserve.day}"></div>`:`<div class="fr"><span>${k==='adj'?'Valor guardado':'Valor'}</span><input class="field" id="rv" inputmode="decimal" value="${k==='adj'?fmt(reserve.saved):''}" placeholder="0,00"></div>`}
 ${k==='take'?`<div class="seg"><button class="${mode==='recompor'?'on':''}" data-m="recompor">Recompor este mês</button><button class="${mode==='plan'?'on':''}" data-m="plan">Retirada planejada</button></div>`:''}
 ${k==='add'||k==='take'?`<p style="margin:0;color:var(--muted);font-size:12px">${k==='add'?'Sai do saldo e vai para o guardado.':'Volta para o saldo. Fica registrado no histórico da reserva.'}</p>`:''}
 <div class="mfoot"><button class="ghost" id="rc">Cancelar</button><button class="btn" id="rg">Salvar</button></div>`;
  $('mbox').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});$('rc').onclick=closeModal;
  $('rg').onclick=()=>{const v=pnum($('rv').value||'0')||0;
   if(k==='plan'){reserve.monthly=v;reserve.day=+$('rd').value||reserve.day;}
   if(k==='adj')reserve.saved=v;
   if(k==='add'&&v){reserve.saved+=v;reserve.hist.unshift({m:'Outubro',v,t:'Guardado'});tx.push({id:++nid,date:TODAYS,desc:'Guardado na reserva',cat:'Reserva',amt:-v,acct:'conta',kind:'aporte'});}
   if(k==='take'&&v){reserve.saved-=v;reserve.hist.unshift({m:'Outubro',v:-v,t:mode==='plan'?'Retirada planejada':'Retirada · recompor este mês'});tx.push({id:++nid,date:TODAYS,desc:'Retirada da reserva',cat:'Reserva',amt:v,acct:'conta',kind:'retirada'});}
   closeModal();render();toast('Reserva atualizada.');};setTimeout(()=>$('rv').focus(),40);};
 draw();$('modal').classList.add('open');}
function openTx(id){openId=id;const t=tx.find(x=>x.id===id);
 $('panel').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="x" id="pc" aria-label="Fechar">${ico('x',18)}</button><span style="color:var(--muted);font-size:12px">${ico('check',12)} Salva sozinho</span></div>
 <input class="bigval num" id="pv" inputmode="decimal" value="${(t.amt<0?'−':'+')+' '+fmt(t.amt)}" aria-label="Valor">
 ${t.inst?`<div style="color:var(--muted);font-size:13px">Parcela ${t.inst.i} de ${t.inst.n} · total ${money(t.inst.total)}</div>`:''}
 <input class="field" id="pd" value="${esc(t.desc)}" aria-label="Descrição">
 <div class="fr"><span>Categoria</span><select class="field" id="pcat">${Object.keys(CATS).map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="fr"><span>Pago com</span><select class="field" id="pa"><option value="conta" ${t.acct==='conta'?'selected':''}>Conta principal</option>${cards.map(c=>`<option value="${c.id}" ${t.acct===c.id?'selected':''}>Cartão ${c.name} (fatura de ${billMonth(c)})</option>`).join('')}</select></div>
 <div class="fr"><span>Data</span><input type="date" class="field" id="pdt" value="${t.date}"></div>
 <label class="rcpt" id="rcpt">${t.receipt?(t.receipt.img?`<img src="${t.receipt.img}" alt="">`:ico('clip',18)):ico('clip',18)}<span style="flex:1">${t.receipt?`<b style="color:var(--text);font-weight:500">${esc(t.receipt.name)}</b><br>Salvo no seu Drive · Arquivos da Sofia`:'Anexar comprovante (foto ou PDF)<br><span style="font-size:12px">Vai para o seu Drive. Também dá para mandar a foto na Conversa.</span>'}</span><input type="file" id="rf" accept="image/*,application/pdf" hidden></label>
 <label class="tgl"><input type="checkbox" id="pnb" ${t.noBal?'checked':''}><span class="sw2"></span><span><b style="font-weight:600">Não mexer no saldo</b><br><span style="color:var(--muted);font-size:12px">Fica registrado, mas o saldo continua igual.</span></span></label>
 ${t.amt<0?`<label class="tgl"><input type="checkbox" id="prf" ${t.refund?'checked':''}><span class="sw2"></span><span><b style="font-weight:600">Vai ser reembolsada</b><br><span style="color:var(--muted);font-size:12px">Continua no saldo e entra em Devoluções como valor a receber.</span></span></label>${t.refund?`<div class="fr"><span>Valor a receber</span><input class="field" id="prv" inputmode="decimal" value="${fmt(t.refund.v)}"></div>`:''}`:''}
 <button class="del" id="pdel">Excluir lançamento</button>`;
 $('scrim').classList.add('open');$('panel').classList.add('open');
 const up=()=>{const v=pnum($('pv').value.replace(/[−+]/g,''));if(!isNaN(v))t.amt=t.amt<0?-v:v;t.desc=$('pd').value||t.desc;t.cat=$('pcat').value;t.acct=$('pa').value;t.date=$('pdt').value||t.date;t.noBal=$('pnb').checked;if($('prv')&&t.refund)t.refund.v=pnum($('prv').value)||t.refund.v;render();};
 ['pv','pd','prv'].forEach(k=>$(k)&&($(k).oninput=up));['pcat','pa','pdt','pnb'].forEach(k=>$(k).onchange=up);
 $('rf').onchange=e=>{const f=e.target.files[0];if(!f)return;t.receipt={name:f.name};if(/^image\//.test(f.type)){const r=new FileReader();r.onload=()=>{t.receipt.img=r.result;render();openTx(id);};r.readAsDataURL(f);}else{render();openTx(id);}toast('Comprovante salvo no seu Drive.');};
 if($('prf'))$('prf').onchange=()=>{t.refund=$('prf').checked?{v:-t.amt,st:'pend'}:null;render();openTx(id);};
 $('pdel').onclick=()=>{tx=tx.filter(x=>x!==t);closePanel();render();toast('Lançamento excluído.',[['Desfazer',()=>{tx.push(t);render();}]]);};
 $('pc').onclick=closePanel;}
function closePanel(){$('scrim').classList.remove('open');$('panel').classList.remove('open');openId=null;}
$('scrim').onclick=closePanel;
function closeModal(){$('modal').classList.remove('open');}
$('modal').addEventListener('mousedown',e=>{if(e.target===$('modal'))closeModal();});
function toast(text,actions=[]){$('toastText').textContent=text;$('toastBtns').innerHTML='';actions.forEach(([lab,fn])=>{const b=document.createElement('button');b.textContent=lab;b.onclick=()=>{$('toast').classList.remove('show');fn();};$('toastBtns').appendChild(b);});
 $('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),5200);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal').classList.contains('open'))closeModal();else if(openId)closePanel();}});
render();

</script>
</body>
</html>
