<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f3f8;--surface:#ffffff;--surface2:#efedf5;--field:#f1eff7;--line:#e2dfeb;--text:#1b1a22;--muted:#6f6b7b;--faint:#a29eae;
 --accent:#6c5bd4;--accent-soft:#ebe7fb;--accent-text:#4d3fb0;--on-accent:#ffffff;--ok:#1f8a5b;--ok-soft:#e3f4ec;--danger:#c4455a;
 --scrim:rgba(20,18,30,.42);--shadow:0 18px 50px rgba(20,18,30,.18);color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121118;--surface:#1b1a22;--surface2:#22202a;--field:#24222c;--line:#2e2c37;--text:#ecebf0;--muted:#8d8a96;--faint:#5f5c68;
 --accent:#b5a8f5;--accent-soft:#2a2640;--accent-text:#c9bcff;--on-accent:#221c47;--ok:#9fd8bd;--ok-soft:#1f2a24;--danger:#f08a9a;
 --scrim:rgba(5,4,8,.62);--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121118;--surface:#1b1a22;--surface2:#22202a;--field:#24222c;--line:#2e2c37;--text:#ecebf0;--muted:#8d8a96;--faint:#5f5c68;
 --accent:#b5a8f5;--accent-soft:#2a2640;--accent-text:#c9bcff;--on-accent:#221c47;--ok:#9fd8bd;--ok-soft:#1f2a24;--danger:#f08a9a;
 --scrim:rgba(5,4,8,.62);--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
*:focus{outline:none}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:600;font-size:15px;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand b{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px}
.lab{color:var(--muted);font-size:12px;padding:6px 10px 6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;width:100%;transition:background .12s}
.li:hover{background:var(--surface2)}
.li em{font-style:normal;color:var(--muted);margin-left:auto;font-size:12px}
.li.on{background:var(--accent-soft);color:var(--accent-text)}
.li.newl{color:var(--muted)}
.tgl{display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.sw2{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;margin-top:2px;transition:background .15s}
.sw2:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tgl input:checked+.sw2{background:var(--accent)}
.tgl input:checked+.sw2:after{transform:translateX(14px)}
.mwrap{position:relative}
.iconbtn{padding:8px 10px}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;z-index:15;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .14s ease,transform .16s cubic-bezier(.2,.8,.2,1)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;font-size:13px;transition:background .1s}
.menu button:hover{background:var(--surface2)}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu .danger{color:var(--danger)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.dangerbtn{background:var(--danger);color:#fff}
.chip.icn{padding:7px 9px}
.lrow{display:flex;align-items:center;gap:0;margin-left:-6px}
.lrow .li{flex:1;min-width:0}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .cnt{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;margin-left:auto}
.li.on .cnt{background:var(--surface);color:var(--accent-text)}
.li.parent{color:var(--accent-text)}
.fold{width:18px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s}
.fold:hover{background:var(--surface2)}
.fold svg{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.fold.open svg{transform:rotate(90deg)}
.subs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 32px}
span.fold{pointer-events:none}
.li.sub{padding:6px 9px;font-size:13px;gap:9px;color:var(--muted)}
.li.sub:hover{color:var(--text)}
.li.sub.on{color:var(--accent-text)}
.sw{width:8px;height:8px;border-radius:3px;flex:none}
.ready{color:var(--ok);display:grid;place-items:center}
.li.sub.addg{color:var(--faint);font-size:12px}
.li.sub.addg:hover{color:var(--accent-text)}
.sdiv{height:1px;background:var(--line);margin:10px 10px 4px 22px}
main{padding:24px 40px 110px;max-width:820px;width:100%}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 13px;display:inline-flex;gap:7px;align-items:center;transition:background .12s;white-space:nowrap}
.ghost:hover{background:var(--surface2)}
.ghost.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 18px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.add:focus-within{border-color:var(--accent)}
.add input{flex:1;background:none;border:0;padding:8px 0;font-size:15px;min-width:0}
.parse{display:flex;gap:6px;flex-wrap:wrap;min-height:22px;margin:6px 2px 12px;align-items:center;color:var(--muted);font-size:12px}
.parse:empty{min-height:0;margin:0 0 20px}
.pill{background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px 4px;display:flex;gap:8px;align-items:center}
.sec h3 em{font-style:normal;font-weight:400}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);transition:background .12s,opacity .3s}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.leaving{opacity:0}
.ck{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s;color:transparent}
.ck:hover{border-color:var(--muted)}
.row.done .ck{background:var(--surface2);border-color:var(--faint);color:var(--muted)}
.nm{flex:1;min-width:0;cursor:pointer}
.nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .nm b{text-decoration:line-through;color:var(--muted)}
.nm span{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qty{min-width:34px;text-align:center;font-size:12px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:8px;padding:3px 6px;flex:none}
.pr{font-variant-numeric:tabular-nums;color:var(--text);flex:none}
.row.done .pr{color:var(--muted)}
.lk{color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.donebar{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:2px 4px;margin-bottom:5px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.foot{position:fixed;left:230px;right:0;bottom:0;padding:10px 40px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:flex-start}
.foot>div{max-width:740px;width:100%;display:flex;align-items:center;gap:20px}
.tot{display:flex;gap:22px;flex:1;flex-wrap:wrap}
.tot div{display:flex;flex-direction:column}
.tot span{font-size:12px;color:var(--muted)}
.tot b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
/* painel lateral */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));gap:16px;overflow:auto}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph input{font-size:19px;font-weight:600;background:none;border:0;flex:1;min-width:0}
.x{color:var(--muted);padding:6px;border-radius:8px}.x:hover{background:var(--surface2)}
.fg{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.fr>span{color:var(--muted);font-size:13px}
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
textarea.field{min-height:70px;resize:vertical}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--field);font-size:16px}
.step input{width:64px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 6px 2px}
.gsum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.gsum .tot{gap:32px}
.gsum .tot b{font-size:16px}
.setbud{color:var(--accent-text);font-weight:600;font-size:15px;padding:0;text-align:left}
.gsum .bud{margin:10px 0 0}
.gsum .bsub{margin:5px 0 0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .12s}
.gcard:hover{border-color:var(--faint)}
.gtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.gtop b{color:var(--text);font-weight:600;font-size:15px}
.gmeta{color:var(--muted);font-size:12px}
.gprev{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:8px}
.gfoot b{font-weight:600;font-variant-numeric:tabular-nums}
.gnew{align-items:center;justify-content:center;flex-direction:row;gap:8px;color:var(--accent-text);border-style:dashed;min-height:118px}
.gt{display:flex;align-items:center;gap:8px;color:var(--text)}
.gt b{font-weight:600;font-size:14px}
.gt em{font-style:normal;color:var(--muted);font-size:12px}
.bud{height:4px;border-radius:2px;background:var(--line);margin:8px 2px 0;overflow:hidden}
.bud i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bsub{display:block;color:var(--muted);font-size:12px;margin:5px 2px 0}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:3px;width:max-content}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .12s,color .12s}
.seg button.on{background:var(--accent-soft);color:var(--accent-text)}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 13px;font-size:13px;display:inline-flex;gap:6px;align-items:center;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.saved{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;margin-top:auto}
.del{color:var(--danger);font-size:13px;width:max-content}
/* janelas pequenas */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.modal.open{opacity:1;pointer-events:auto}
.mbox{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 28px 24px;display:flex;flex-direction:column;gap:20px;transform:translateY(8px);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.modal.open .mbox{transform:none}
.mbox h2{font-size:17px;font-weight:600;margin:0}
.mfoot{display:flex;justify-content:flex-end;gap:10px}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.model{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,background .12s}
.model small{color:var(--muted);font-size:12px;line-height:1.35}
.model.sel{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:calc(50% + 115px);bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--text);color:var(--bg);border-radius:12px;padding:11px 16px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;font-size:13px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.sk{height:40px;border-radius:12px;background:linear-gradient(90deg,var(--surface2) 0,var(--field) 40%,var(--surface2) 80%);background-size:300% 100%;animation:sh 1.1s linear infinite;margin:0 0 14px}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.modal,.mbox,.row,.sk{transition:none;animation:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand,.lab{display:none}.li{width:auto;white-space:nowrap}main{padding:22px 16px 140px}.foot{left:0;padding:12px 16px}.toast{left:50%}.models{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
 <nav class="side" id="side" aria-label="Suas listas"></nav>
 <main id="main"></main>
</div>
<div class="foot" id="foot"></div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Item da lista"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><span id="toastBtns"></span></div>

<script>
const P={cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',gift:'<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1"/>',plane:'<path d="M10 14l-6-2 1-2 7 1 4-6h2l-2 7 4 2-1 2-5-1-2 5h-2z"/>',heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',tool:'<path d="M14 6a4 4 0 005 5l-8 8a2 2 0 01-3-3z"/>',paw:'<circle cx="7" cy="10" r="1.6"/><circle cx="10" cy="6.5" r="1.6"/><circle cx="14" cy="6.5" r="1.6"/><circle cx="17" cy="10" r="1.6"/><path d="M8.5 17c0-3 1.6-5 3.5-5s3.5 2 3.5 5c0 2-7 2-7 0z"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',right:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',repeat:'<path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/>',cart:'<path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',chart:'<path d="M4 19h16M6 15l4-4 3 3 6-7"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 5v16M19 19v2H6"/>',wallet:'<path d="M4 7a2 2 0 012-2h11v4"/><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M16 13.5h.01"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',share:'<circle cx="6" cy="12" r="2.2"/><circle cx="17" cy="6" r="2.2"/><circle cx="17" cy="18" r="2.2"/><path d="M8 11l7-4M8 13l7 4"/>',store:'<path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/>'};
const ico=(n,s=16)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${P[n]||''}</svg>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const brl=v=>v==null||isNaN(v)?'':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const lineTotal=it=>it.price;
const calcText=()=>'';

 mercado:{name:'Mercado',icon:'cart',desc:'Separa por seção do mercado e soma o carrinho',ph:'Adicionar… ex.: 2 leite, 1 kg tomate'},

function parse(raw){const isUrl=/^(https?:\/\/|www\.)\S+$/i.test(raw);if(isUrl)return{url:raw.startsWith('http')?raw:'https://'+raw};
 let s=raw,qty=1,unit='',price=null;
 const pm=s.match(/(?:r\$\s*)?(\d+[.,]\d{2})\s*$/i)||s.match(/r\$\s*(\d+(?:[.,]\d{1,2})?)/i);if(pm){price=parseFloat(pm[1].replace(',','.'));s=s.replace(pm[0],'').trim();}
 const qm=s.match(/^(\d+(?:[.,]\d+)?)\s*(?:(kg|g|l|ml|un|cx|pct|dz)\b)?\s*(?:x\s+)?(?:de\s+)?(.+)$/i);
 if(qm){qty=parseFloat(qm[1].replace(',','.'));unit=(qm[2]||'').toLowerCase();s=qm[3];}
 else{const qm2=s.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:(kg|g|l|ml|un|cx|pct|dz)\b)?$/i);if(qm2){s=qm2[1];qty=parseFloat(qm2[2].replace(',','.'));unit=(qm2[3]||'').toLowerCase();}}
 if(unit==='un')unit='';const name=s.charAt(0).toUpperCase()+s.slice(1);return{name,qty,unit,price};}
function showParse(v0){const el=$('parse');if(!v0.trim()){el.innerHTML='';return;}const {raw:v,tag}=splitTag(v0.trim());const l=L(),p=parse(v.trim()||'');
 const gp=l.model==='compras'?(()=>{const g=guessGroup(p.name||'',tag,p.url?storeName(host(p.url)):'',true);return `<span class="pill">${g&&g.startsWith('new:')?'Novo grupo '+esc(g.slice(4)):g?'Grupo '+esc(gname(g)):'Sem grupo'}</span>`;})():'';
 if(p.url){el.innerHTML=`<span class="pill">${ico('link',12)}Link: vou buscar nome, preço e loja</span>${gp}<span>Enter para adicionar</span>`;return;}
 const bits=[];if(l.model!=='simples'&&(p.qty!==1||p.unit))bits.push(`Qtd ${String(p.qty).replace('.',',')}${p.unit?' '+p.unit:''}`);
 if(l.model==='mercado')bits.push(sectionOf(p.name));if(p.price!=null&&l.model!=='simples')bits.push(brl(p.price));if(gp)bits.push('');
 const dup=mine().find(i=>!i.done&&norm(i.name)===norm(p.name));
 el.innerHTML=bits.filter(Boolean).map(b=>`<span class="pill">${b}</span>`).join('')+gp+(dup?`<span>Já está na lista: Enter soma na quantidade</span>`:'<span>Enter para adicionar</span>');}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch{return u}}
function storeName(h){const m={'mercadolivre.com.br':'Mercado Livre','kabum.com.br':'KaBuM!','amazon.com.br':'Amazon','pichau.com.br':'Pichau','shopee.com.br':'Shopee','aliexpress.com':'AliExpress','magazineluiza.com.br':'Magalu'};return m[h]||h.split('.')[0].replace(/^./,c=>c.toUpperCase());}
function slugTitle(u){try{const url=new URL(u);const parts=url.pathname.split('/').filter(Boolean);let s=decodeURIComponent(parts.sort((a,b)=>b.length-a.length)[0]||'');s=s.replace(/\.(html?|php)$/,'').replace(/MLB-?\d+/i,'').replace(/[-_]+/g,' ').trim();if(!s||/^[a-z0-9]{8,}$/i.test(s))return null;return s.charAt(0).toUpperCase()+s.slice(1);}catch{return null}}
function fakePrice(u){let h=0;for(const c of u)h=(h*31+c.charCodeAt(0))>>>0;return 80+(h%2400)+.9;}

 if(p.url){$('loading').innerHTML='<div class="sk"></div>';setTimeout(()=>{$('loading').innerHTML='';const h=host(p.url);

 const dup=mine().find(i=>!i.done&&norm(i.name)===norm(p.name));
 if(dup){dup.qty=+(dup.qty+p.qty).toFixed(2);if(p.price!=null)dup.price=p.price;lastAdded=dup.id;render();$('q').focus();return;}
 const it={id:++nid,list:cur,name:p.name,qty:p.qty,unit:p.unit,price:l.model==='simples'?null:p.price,section:sectionOf(p.name),store:'',link:'',done:false,links:[]};
 if(l.model==='compras')it.group=guessGroup(p.name,tag,'');
 items.push(it);lastAdded=it.id;render();$('q').focus();
 if(l.model==='compras'&&gfilter==='all')toast(`Adicionado em ${gname(it.group||'none')}.`,[['Abrir grupo',()=>{gfilter=it.group||'none';render();}]]);}

 if($('rOff'))$('rOff').onclick=()=>{l.remind=null;l.remindAt=null;l.remindAgenda=false;closeModal();render();toast('Lembrete cancelado'+(l.remindAgenda?'':'')+'. Sai de Lembretes e da Agenda.');};}
/* ------- menu da lista ------- */
document.addEventListener('click',e=>{const m=$('menu');if(m&&m.classList.contains('open')&&!e.target.closest('.mwrap'))m.classList.remove('open');});
function confirmBox(title,text,okLabel,onOk){$('mbox').innerHTML=`<h2>${title}</h2><p style="margin:0;color:var(--muted);line-height:1.55">${text}</p><div class="mfoot"><button class="ghost" id="cCancel">Cancelar</button><button class="btn dangerbtn" id="cOk">${okLabel}</button></div>`;
 $('modal').classList.add('open');$('cCancel').onclick=closeModal;$('cOk').onclick=()=>{closeModal();onOk();};setTimeout(()=>$('cOk').focus(),40);}
function confirmDeleteList(){const l=L(),its=items.filter(i=>i.list===l.id),h=(l.history||[]).length;
 confirmBox(`Excluir “${esc(l.name)}”?`,`${its.length} ${its.length===1?'item':'itens'}${h?` e ${h} ${h===1?'registro':'registros'} do histórico`:''} vão junto. Os lançamentos já feitos em Finanças continuam lá.`,'Excluir lista',()=>{
  const idx=lists.indexOf(l);lists=lists.filter(x=>x!==l);items=items.filter(i=>i.list!==l.id);gfilter='all';cur=lists[0]?.id;render();
  toast(`Lista “${l.name}” excluída.`,[['Desfazer',()=>{lists.splice(idx,0,l);items.push(...its);cur=l.id;render();}]]);});}
function confirmClearHistory(){const l=L(),H=l.history||[];if(!H.length)return;
 confirmBox('Apagar histórico?',`As ${H.length} ${H.length===1?'compra salva':'compras salvas'} de “${esc(l.name)}” somem do histórico. A lista e os lançamentos em Finanças não mudam.`,'Apagar histórico',()=>{l.history=[];render();toast('Histórico apagado.',[['Desfazer',()=>{l.history=H;render();}]]);});}
function openEditList(){const l=L(),ICONS=['cart','bag','list','home','gift','plane','heart','tool','paw'];let icon=l.icon||MODELS[l.model].icon;
 const draw=()=>{$('mbox').innerHTML=`<h2>Editar lista</h2><input class="field" id="eName" value="${esc($('eName')?.value??l.name)}" aria-label="Nome da lista">
 <div class="fr" style="grid-template-columns:60px 1fr"><span>Ícone</span><div class="chips">${ICONS.map(k=>`<button class="chip icn ${icon===k?'sel':''}" data-ic="${k}" aria-label="Ícone ${k}">${ico(k,16)}</button>`).join('')}</div></div>
 <div class="mfoot"><button class="ghost" id="eCancel">Cancelar</button><button class="btn" id="eGo">Salvar</button></div>`;
  $('mbox').querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{icon=b.dataset.ic;draw();});
  const go=()=>{l.name=$('eName').value.trim()||l.name;l.icon=icon;closeModal();render();};$('eGo').onclick=go;$('eCancel').onclick=closeModal;$('eName').onkeydown=e=>{if(e.key==='Enter')go();};};
 draw();$('modal').classList.add('open');setTimeout(()=>$('eName').select(),40);}
/* ------- nova lista ------- */
function openNewList(){let model='mercado',icon=null;const ICONS=['cart','bag','list','home','gift','plane','heart','tool','paw'];
 const draw=()=>{$('mbox').innerHTML=`<h2>Nova lista</h2><input class="field" id="nName" placeholder="Nome da lista" value="${esc($('nName')?.value||'')}">
 <div class="models">${Object.entries(MODELS).map(([k,m])=>`<button class="model ${k===model?'sel':''}" data-md="${k}">${ico(m.icon,18)}<b style="font-weight:600">${m.name}</b><small>${m.desc}</small></button>`).join('')}</div>
 <div class="fr" style="grid-template-columns:60px 1fr"><span>Ícone</span><div class="chips">${ICONS.map(k=>`<button class="chip icn ${(icon||MODELS[model].icon)===k?'sel':''}" data-ic="${k}" aria-label="Ícone ${k}">${ico(k,16)}</button>`).join('')}</div></div>
 <div class="mfoot"><button class="ghost" id="nCancel">Cancelar</button><button class="btn" id="nGo">Criar lista</button></div>`;
  $('mbox').querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{icon=b.dataset.ic;draw();});
  $('mbox').querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{model=b.dataset.md;draw();});
  $('nCancel').onclick=closeModal;$('nGo').onclick=create;$('nName').onkeydown=e=>{if(e.key==='Enter')create();};setTimeout(()=>$('nName').focus(),40);};
 const create=()=>{const n=$('nName').value.trim()||MODELS[model].name;const id='l'+(++nid);lists.push({id,name:n,model,icon:icon||MODELS[model].icon,history:[],...(model==='compras'?{groups:[]}:{})});cur=id;closeModal();render();setTimeout(()=>$('q').focus(),50);};
 draw();$('modal').classList.add('open');}
/* ------- aviso ------- */
function toast(text,actions=[]){$('toastText').textContent=text;$('toastBtns').innerHTML='';actions.forEach(([lab,fn])=>{const b=document.createElement('button');b.textContent=lab;b.onclick=()=>{$('toast').classList.remove('show');fn();};$('toastBtns').appendChild(b);});
 $('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),5000);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal').classList.contains('open'))closeModal();else if(openId)closePanel();else if(L()?.model==='compras'&&gfilter!=='all'&&document.activeElement?.id!=='q'){gfilter='all';render();}}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){e.preventDefault();$('q')?.focus();}});
render();
</script>
</body>
</html>
