    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; overflow: clip; margin: 0; background: #F7F6FA; }
      /* 04/11/2026 (print do Pedro: menu lateral cortado e a pagina inteira deslocada ~135 px para a esquerda): com "hidden" o
         navegador ainda rola a raiz de lado ao focar algo que passa da borda; "clip" nao deixa a raiz rolar de jeito nenhum */
      html, #root { overflow: clip; }
      @media (prefers-color-scheme: dark) { body { background: #121017; } }
      #root { display: flex; height: 100%; flex: 1; }
      /* 04/11/2026 (Pedro: "quando abre o site, um fade rapido de toda a tela com a cor do site"): veu na cor do fundo que cobre
         a montagem e some depressa quando o app esta pronto (launch-handoff.ts); se o app nao avisar, some sozinho em 8 s */
      #sofia-veil { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; will-change: opacity; transform: translateZ(0); background: #F7F6FA; animation: sofia-veil-out 1ms linear 8s both; }
      /* 07/11/2026 (Pedro: "tira a roda de loading e tira o fade"): o veu so cobre a montagem e sai de uma vez, sem bolinha e sem fade */
      @media (prefers-color-scheme: dark) { #sofia-veil { background: #121017; } }
      #sofia-veil.out { animation: sofia-veil-open 180ms ease-out 0s both; } /* 07/11/2026 (Pedro): fade rapido na cor do fundo, por cima de tudo */
      @keyframes sofia-veil-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes sofia-veil-open { from { opacity: 1; } to { opacity: 0; } }
      ::selection { background: rgba(114, 88, 232, 0.28); }
      /* 0.3.267: sem contorno de clique em nenhum elemento do site */
      *:focus, *:focus-visible { outline: none !important; }
      input, textarea, select, button, [tabindex] { outline: none; -webkit-tap-highlight-color: transparent; }
